# Conexion a MySQL (crea antes la base: CREATE DATABASE soporte_db;)
spring.datasource.url=jdbc:mysql://localhost:3306/soporte_db
spring.datasource.username=root
spring.datasource.password=

# update = JPA crea/actualiza las tablas solo a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# muestra en consola el SQL que genera JPA (util para estudiar)
spring.jpa.show-sql=true
